name: web-build

# Builds the web/ Next.js app on every PR and push to main.
#
# medomni CI otherwise runs only ruff + pytest + manifest + secrets — all
# Python. Nothing built or type-checked the web/ app, so a TypeScript error
# (PR #389 left an unhandled SkillIntent member in skill-registry.ts) reached
# main undetected and silently broke Vercel deploys for days. `next build`
# runs the TypeScript check and the production build; a green check here
# means the Vercel production build will succeed.

on:
  pull_request:
  push:
    branches: [main]

# Read-only default token: none of these jobs write to the repo.
permissions:
  contents: read
jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (next build — TypeScript check + production build)
        run: pnpm build
